<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan to join — Organized AI</title>
<link rel="icon" href="https://organizedai.vip/IMG_1110.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b09; --card:#141210; --line:#2a2520; --text:#f0ece4; --muted:#a09888;
  --gold:#FFE94A; --gold2:#F5D623;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:36px 32px 30px;text-align:center;
}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--mono);
  font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand .ai{color:var(--gold2)}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 26px}
#qr{background:#fff;display:inline-block;padding:14px;border-radius:10px;line-height:0}
.code{margin-top:22px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.code b{color:var(--gold2);font-size:14px;letter-spacing:.04em}
.fallback{margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.print-btn{margin-top:26px;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:6px;padding:8px 16px;font:inherit;font-size:12px;cursor:pointer}
.print-btn:hover{border-color:var(--gold2);color:var(--text)}

@media print{
  body{background:#fff;color:#000;padding:0}
  .card{background:#fff;border:none;box-shadow:none;max-width:100%}
  .brand,.sub,.code,.code b,.fallback{color:#000}
  .brand .ai{color:#000}
  #qr{border:1px solid #ccc}
  .print-btn{display:none}
}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="https://organizedai.vip/IMG_1110.PNG" alt="Organized AI"> ORGANIZED <span class="ai">AI</span></div>
    <h1 id="title">Scan to join the leaderboard</h1>
    <p class="sub" id="subtitle">The Ultimate Coworking Day</p>
    <div id="qr"></div>
    <div class="code">Or run: <b id="join-code">COWORK-0903</b></div>
    <div class="fallback" id="fallback-url">board.organizedai.vip/join</div>
    <button class="print-btn" onclick="window.print()">Print this card</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var workshop = qs.get("w") || "coworking";
  var joinUrl = location.origin + "/join?w=" + encodeURIComponent(workshop);

  document.getElementById("fallback-url").textContent =
    location.host + "/join" + (workshop !== "coworking" ? "?w=" + workshop : "");

  var qr = qrcode(0, "M");
  qr.addData(joinUrl);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 });

  // Optional: ?code=...&name=...&title=... let one printed template serve
  // any workshop without editing the file.
  var code = qs.get("code");
  var name = qs.get("name");
  if (code) document.getElementById("join-code").textContent = code;
  if (name) document.getElementById("subtitle").textContent = name;
})();
</script>
</body>
</html>
